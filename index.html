<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation de Spectacles</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="top-banner">
        <p>Book your show ticket !</p>
    </header>

    <main class="container">
        
        <section class="weekly-shows">
            <h2 class="section-title">SHOWING THIS WEEK</h2>
            
            <div class="cards-row" id="cards-container">
                </div>
        </section>

        <hr class="section-divider">

        <section class="find-favorite">
            <h2 class="section-title">FIND YOUR NEXT FAVORITE</h2>
            
            <div class="filters-row flex-row">
                <div class="filter-pill">Comedy</div>
                <div class="filter-pill">Tragedy</div>
                <div class="filter-pill active-filter">Musical</div> <div class="filter-pill">Date : -/-/-</div>
                <div class="filter-pill">Location :</div>
            </div>

            <div class="small-shows-row flex-row">
                <div class="small-show">
                    <img src="https://librairie.philharmoniedeparis.fr/sites/default/files/images/2019/02/22/cahiercomedieb.jpg" alt="Comédie musicale" class="small-show">
                    <p class="small-title">Comédie musicale</p>
                </div>
                <div class="small-show">
                    <img src="https://lafilmotheque.fr/v4/content/uploads/2023/01/la_la_land-262021831-large-720x1067.jpg" alt="LaLaLand" class="small-show">
                    <p class="small-title">LaLaLand</p>
                </div>
            </div>
        </section>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
